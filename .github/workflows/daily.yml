name: Daily edition

# Writes the day's edition and commits it. The host rebuilds the site when the
# commit lands. Secrets and settings are listed under "Going live" in the README.

# The day's run is started from outside, at 06:30 UTC, which is 12:00 in India: a scheduler calls this workflow
# with a token that may do nothing else. GitHub's own schedule starts hours late, so it is kept only as a
# fallback, and does nothing on a day when the run from outside was made.
on:
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  # To see whether the day's run was made.
  actions: read

# One edition at a time: a run started by hand waits for a scheduled one, and the other way round.
concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  # Whether this run has anything to do. One started from outside or by hand always has.
  due:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.made.outputs.due }}
    steps:
      - id: made
        env:
          GH_TOKEN: ${{ github.token }}
        # Counted over the last 18 hours and not the calendar day, since this run may itself start past midnight.
        # If the question cannot be asked, the edition is written: a second pass costs little, a missed day more.
        run: |
          due=yes
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            made=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow daily.yml --event workflow_dispatch \
              --created ">=$(date -u -d '18 hours ago' +%FT%TZ)" --json conclusion \
              --jq '[.[] | select(.conclusion == "success")] | length' || echo 0)
            if [ "$made" -gt 0 ]; then
              due=no
              echo "The day's run was already made. Nothing to do."
            fi
          fi
          echo "due=$due" >> "$GITHUB_OUTPUT"

  edition:
    needs: due
    if: needs.due.outputs.due == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      LLM_MODELS: ${{ vars.LLM_MODELS }}
      LLM_IMAGE_MODEL: ${{ vars.LLM_IMAGE_MODEL }}
      LLM_ALLOW_PAID: ${{ vars.LLM_ALLOW_PAID }}
      LLM_MAX_CALLS: ${{ vars.LLM_MAX_CALLS }}
      # The most one run may spend. The pipeline stops cleanly when it is reached.
      LLM_MAX_COST_USD: ${{ vars.LLM_MAX_COST_USD }}
      SCORE_THRESHOLD: ${{ vars.SCORE_THRESHOLD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Write the edition
        run: npm run pipeline

      # The edition of a new release, on the two days one is owed. The day's paper is published whether or not this works.
      - name: Build the release edition
        if: always()
        continue-on-error: true
        # A build reads the notes slowly, to be a polite reader. Stopped here, the day's paper is still committed.
        timeout-minutes: 25
        run: npm run release-edition

      # Who read the paper, up to yesterday. The edition is published whether or not this works.
      - name: Fetch readership
        if: always()
        continue-on-error: true
        env:
          READERSHIP_API_TOKEN: ${{ secrets.READERSHIP_API_TOKEN }}
          READERSHIP_ACCOUNT_ID: ${{ secrets.READERSHIP_ACCOUNT_ID }}
          READERSHIP_SITE_ID: ${{ secrets.READERSHIP_SITE_ID }}
        run: npm run readership

      # Runs even when the pipeline stopped part-way: it writes each story as it goes,
      # and what it has done is worth keeping.
      - name: Commit the edition
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/stories src/content/briefs src/content/bulletin public/figures data
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Edition $(TZ=Asia/Kolkata date +%F)"
          git pull --rebase
          git push
