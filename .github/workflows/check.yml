name: Check

# Tests, types, lint and a build on every pull request, so a change that breaks the paper is found before it is merged
# and not at the next day's run, which runs the tests too but only after the change is on main. A change pushed to main
# without a pull request is checked as well, so a mistake there is found the same hour.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run check

      - run: npm run lint

      - run: npm run build

      # The built pages agree on the day: the Bulletin is as of the front page's edition.
      - run: npm run check-site
